<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Tabela</title>

        <style>

        body{
            background-color: rgb(224, 177, 162);
            margin: 30px;
            padding:30px;
        }

        header{
            background-color: cornflowerblue;
            margin: 5px;
            padding: 0px;
            border-radius: 10px;
            color: black;
            text-align: center;
        }
        main{
            background-color:white;
            margin:5px;
            padding:1px;
            max-width: 400px;
       }
        img{
            max-width: 200px;
        }
      
        </style>
    </head>
    <body>
        <header>
        <h1> Crochê </h1>
        </header>

        <main>

         <table border="1">
            <tr>
                <th>Peça</th>
                <th>Agulha</th>
                <th>Linha</th>
                <th>Quantidade de rolos</th>
            </tr>
            <tr>
                <td><img src="img/blusapraia.jpg" alt="blusa de crochê estilo praia"></td>
                <td>5,0mm</td>
                <td>Número 4</td>
                <td>1 Rolo</td>
            </tr>
            <tr>
                <td><img src="img/blusa.jpg" alt="blusa de crochê"></td>
                <td>3,0mm</td>
                <td>Número 2</td>
                <td>1 Rolo</td>
            </tr>
            <tr>
                <td><img src="img/e968ec74bab3bc0a99ed6ede79d8f62c.jpg" alt="blusa de Crochê"></td>
                <td>6,0mm</td>
                <td>Número 4</td>
                <td>2 Rolos</td>
            </tr>
             </table>

             </main>
    </body>
</html>
